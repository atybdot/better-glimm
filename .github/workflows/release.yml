name: release

# A `push.tags` filter has no branch scope: a `release-*` tag on any branch
# triggers this workflow. The guard job below rejects refs that are not
# reachable from the default branch.
on:
  push:
    tags: ["release-*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.verify.outputs.allowed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: verify
        name: Require the ref to be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::not publishing: ref is not on $DEFAULT_BRANCH"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: guard
    if: needs.guard.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter better-glimm test
      - run: pnpm --filter better-glimm build

      - name: Publish better-glimm
        run: pnpm --filter better-glimm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: GitHub release notes
        if: startsWith(github.ref, 'refs/tags/release-')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
